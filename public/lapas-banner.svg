<path d="M112 105 H192" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".8"/>
<path d="M112 130 H192" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".35"/>
</g>
<!-- small sauce bowls -->
<g opacity=".9">
<ellipse cx="330" cy="445" rx="75" ry="22" fill="#d7d7d7"/><ellipse cx="330" cy="438" rx="58" ry="18" fill="#b82d1d"/>
<ellipse cx="1260" cy="445" rx="75" ry="22" fill="#d7d7d7"/><ellipse cx="1260" cy="438" rx="58" ry="18" fill="#b82d1d"/>
